<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><rect width="1440" height="940" fill="#0c1322"/><text x="64" y="78" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#edf3ff">MockLite / C# source generation</text><text x="64" y="146" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="700" fill="#7ce6c5">FROM APPLICATION CONTRACT TO TEST SCENARIO</text><text x="64" y="212" font-family="DejaVu Sans,sans-serif" font-size="49" font-weight="700" fill="#edf3ff">Your next testing API</text><text x="64" y="270" font-family="DejaVu Sans,sans-serif" font-size="49" font-weight="700" fill="#edf3ff">is already in your interfaces.</text><text x="64" y="317" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#b3bfd5">Generate the test double. Discover its members. Describe the behavior that matters.</text><rect x="64" y="352" width="500" height="408" rx="14" fill="#111d30" stroke="#30415d"/><path d="M 64 406 H 564" stroke="#30415d"/><text x="88" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="600" fill="#b3bfd5">01   Select a contract in your test project</text><rect x="584" y="352" width="792" height="408" rx="14" fill="#111d30" stroke="#30415d"/><path d="M 584 406 H 1376" stroke="#30415d"/><text x="608" y="385" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="600" fill="#b3bfd5">02   Configure and verify with the generated API</text><text x="88" y="444" font-family="monospace" font-size="16" fill="#d7e5f6">[GenerateMock&lt;IPriceFeed&gt;]</text><text x="88" y="469" font-family="monospace" font-size="16" fill="#d7e5f6">public&#160;partial&#160;class&#160;TestDoubles&#160;{&#160;}</text><text x="88" y="494" font-family="monospace" font-size="16" fill="#d7e5f6"></text><text x="88" y="519" font-family="monospace" font-size="16" fill="#d7e5f6">public&#160;interface&#160;IPriceFeed</text><text x="88" y="544" font-family="monospace" font-size="16" fill="#d7e5f6">{</text><text x="88" y="569" font-family="monospace" font-size="16" fill="#d7e5f6">&#160;&#160;&#160;&#160;decimal&#160;GetPrice(string&#160;sku);</text><text x="88" y="594" font-family="monospace" font-size="16" fill="#d7e5f6">}</text><text x="608" y="444" font-family="monospace" font-size="16" fill="#d7e5f6">var&#160;prices&#160;=&#160;new&#160;MockPriceFeed();</text><text x="608" y="469" font-family="monospace" font-size="16" fill="#d7e5f6"></text><text x="608" y="494" font-family="monospace" font-size="16" fill="#d7e5f6">prices.SetupGetPrice(sku&#160;=&gt;&#160;sku&#160;==&#160;&quot;SKU-42&quot;)</text><text x="608" y="519" font-family="monospace" font-size="16" fill="#d7e5f6">&#160;&#160;&#160;&#160;.Callback(sku&#160;=&gt;&#160;Console.WriteLine(sku))</text><text x="608" y="544" font-family="monospace" font-size="16" fill="#d7e5f6">&#160;&#160;&#160;&#160;.Returns(19.95m);</text><text x="608" y="569" font-family="monospace" font-size="16" fill="#d7e5f6"></text><text x="608" y="594" font-family="monospace" font-size="16" fill="#d7e5f6">//&#160;sku&#160;is&#160;inferred&#160;as&#160;string&#160;in&#160;both&#160;lambdas.</text><text x="608" y="619" font-family="monospace" font-size="16" fill="#d7e5f6">IPriceFeed&#160;feed&#160;=&#160;prices;</text><text x="608" y="644" font-family="monospace" font-size="16" fill="#d7e5f6">decimal&#160;price&#160;=&#160;feed.GetPrice(&quot;SKU-42&quot;);</text><text x="608" y="669" font-family="monospace" font-size="16" fill="#d7e5f6"></text><text x="608" y="694" font-family="monospace" font-size="16" fill="#d7e5f6">prices.VerifyGetPrice(</text><text x="608" y="719" font-family="monospace" font-size="16" fill="#d7e5f6">&#160;&#160;&#160;&#160;sku&#160;=&gt;&#160;sku&#160;==&#160;&quot;SKU-42&quot;,&#160;Times.Once);</text><text x="88" y="663" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#7ce6c5">Build → MockPriceFeed</text><text x="88" y="696" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#b3bfd5">Setup and verification members</text><text x="88" y="721" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#b3bfd5">generated for your contract.</text><text x="64" y="810" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#edf3ff">Discover as you type</text><text x="64" y="842" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aabbd3">Member-specific methods appear</text><text x="64" y="867" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aabbd3">in IntelliSense.</text><text x="514" y="810" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#edf3ff">Keep behavior typed</text><text x="514" y="842" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aabbd3">Callbacks and return values follow</text><text x="514" y="867" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aabbd3">the interface signature.</text><text x="964" y="810" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="600" fill="#edf3ff">Inspect what runs</text><text x="964" y="842" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aabbd3">Concrete C# implementations are</text><text x="964" y="867" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aabbd3">generated during your build.</text><text x="64" y="912" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400" fill="#93a5bf">Illustrated code walkthrough · BbQ.MockLite + BbQ.MockLite.Generators · using BbQ.MockLite; omitted for space</text></svg>